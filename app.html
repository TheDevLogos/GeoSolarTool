  <script src="app-integration.js?v=20260824-portal-v11"></script>
  <script>
  (function(){
    'use strict';
    var guard=document.getElementById('geosolar-auth-guard');
    function redirect(reason){var q='index.html?login=1&target=geosolar';if(reason)q+='&reason='+encodeURIComponent(reason);window.location.replace(q);}
    function allow(session){
      var user=session&&session.user;
      if(!user){redirect('session');return;}
      if(user.forcePasswordChange){redirect('password');return;}
      var modules=(user.permissions&&user.permissions.modules)||[];
      if(modules.indexOf('geosolar')<0){redirect('forbidden');return;}
      guard.hidden=true;
    }
    document.addEventListener('latroy:auth-session',function(e){allow(e.detail||{});});
    document.addEventListener('latroy:auth-required',function(){redirect('session');});
    async function revalidate(){
      try{
        if(!window.LatroyBackend||!window.LatroyBackend.auth||!window.LatroyBackend.auth.hasSession()){redirect('session');return;}
        var session=await window.LatroyBackend.auth.restore();
        if(session)allow(session);
      }catch(_){redirect('session');}
    }
    window.addEventListener('DOMContentLoaded',function(){
      setTimeout(function(){
        if(!window.LatroyBackend||!window.LatroyBackend.auth||!window.LatroyBackend.auth.hasSession()){redirect('session');}
      },300);
      setInterval(function(){if(document.visibilityState==='visible')revalidate();},300000);
    });
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')revalidate();});
  })();
  </script>
